<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Website</title>
    <style>
        body {
            background-color: #d2d2d2;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #143be8;
            color: rgba(255, 255, 255, 0.696);
            text-align: center;
            padding: 1em 0;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #333;
        }
        .container {
            padding: 20px;
        }
        footer {
            background-color: #333;
            color: rgba(255, 255, 255, 0.606);
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

        .timer {
            background-color: rgba(255, 255, 255, 0.713);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Random Codeforces stuff :O</h1>
    </header>  
    <div id="userInput">
        <label for="handle">Enter Handle:</label>
        <input type="text" id="handle" placeholder="e.g., tourist">
        <button id="fetchButton">Get User Info</button>
    </div>
    <div id="userInfo"></div>

    <script>
        // script.js

document.getElementById("fetchButton").addEventListener("click", () => {
    const handle = document.getElementById("handle").value.trim();
    const userInfoDiv = document.getElementById("userInfo");

    // Clear previous results
    userInfoDiv.innerHTML = "";

    if (!handle) {
        userInfoDiv.innerHTML = "<p>Please enter a handle.</p>";
        return;
    }

    const url = `https://codeforces.com/api/user.info?handles=${handle}`;

    fetch(url)
        .then((response) => response.json())
        .then((data) => {
            if (data.status === "OK") {
                const user = data.result[0];
                userInfoDiv.innerHTML = `
                    <h3>User Info</h3>
                    <p><strong>Handle:</strong> ${user.handle}</p>
                    <p><strong>Rank:</strong> ${user.rank}</p>
                    <p><strong>Rating:</strong> ${user.rating}</p>
                    <p><strong>Max Rank:</strong> ${user.maxRank}</p>
                    <p><strong>Max Rating:</strong> ${user.maxRating}</p>
                `;
            } else {
                userInfoDiv.innerHTML = `<p>Error: ${data.comment}</p>`;
            }
        })
        .catch((error) => {
            userInfoDiv.innerHTML = `<p>Error fetching data: ${error.message}</p>`;
        });
});

    </script>

    <footer>
        <p> Cheezits are cool :D. </p>
    </footer>
</body>
</html>
