<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Problem Recommender</title>
    <link rel = "stylesheet" href = "style.css">

    <h2>Welcome back, {UserID}!</h2>

    <div class="container">

            </div>

            <div class="problems">
                <div class="problem">
                    <span>Problem name</span>

                </div>
                <div class="problem">

                </div>
                <div class="problem">

                </div>
                <div class="problem">

                </div>
                <div class="problem">
                    <span>Problem name</span>
                    <button>Go to problem</button>
                </div>
            </div>

            <button class="generate-btn">✨ Generate my own</button>
        </div>
        
        <div class="right">
            <div class="user-stats">
                <h3>About you</h3>
                <div class="stats-box">Rating</div>
                <div class="stats-box"># problems solved overall</div>
                <div class="see-more">See more</div>
            </div>
        </div>
    </div>
